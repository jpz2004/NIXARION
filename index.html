<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso | Nixarion</title>
  <link rel="icon" href="Nixarion_libre_blanco_16x16.png" type="image/png">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: rgba(255, 255, 255, 0.9);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    } 

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(#0000008d, #ffffff48, #00000086),
                  url("Fondo_pradera.png") no-repeat center center;
      background-size: cover; 
      opacity: 1; 
      pointer-events: none; 
      z-index: -1; 
    } 
      
    h1 {
      font-family: 'Times New Roman', Times, serif;
      margin-top: 50px;
      font-size: 2rem;
      letter-spacing: 2px;
      color: white; 
      padding: 5px 15px;
      background: linear-gradient(to right, rgba(0,0,0,0.8), rgba(0, 0, 0, 0.3));
      border-radius: 8px; 
      display: inline-block; 
      text-shadow: 2px 2px 5px rgba(0,0,0,0.6); 
    }


    #clock {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 20px 0;
      text-shadow: 0 0 10px rgb(255, 255, 255);
      color: #000000;
    }

    a button {
      font-family: 'Times New Roman', Times, serif;
      margin: 20px 0 40px 0;
      padding: 8px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      background: linear-gradient(135deg, #ffffff, #ffffff);
      color: #111;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    a button:hover {
      background: linear-gradient(135deg, #000000, #000000);
      color: rgb(255, 255, 255);
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <!-- Texto superior -->
  <h1><em>BIENVENIDO A <strong>NIXARION</strong></em></h1>

  <!-- Reloj -->
  <div id="clock"></div>
  
  <!-- Botón -->
  <a href="Inicio.html">
    <button><em>INGRESAR</em></button>
  </a>

  <script>
    function actualizarReloj() {
      const clock = document.getElementById('clock');
      const ahora = new Date();
      let horas = ahora.getHours().toString().padStart(2, '0');
      let minutos = ahora.getMinutes().toString().padStart(2, '0');
      let segundos = ahora.getSeconds().toString().padStart(2, '0');
      clock.textContent = `${horas}:${minutos}:${segundos}`;
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();
  </script>
</body>
</html>
